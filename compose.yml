services:
  proxy:
    build: .
    container_name: claude-proxy
    restart: unless-stopped
    ports:
      - "54545:54545"    # OAuth PKCE callback — browser must reach localhost:54545
    volumes:
      - ./state:/app/state          # SQLite DB
      - ./credentials:/credentials    # OAuth claude-*.json credentials
    environment:
      # App
      - NODE_ENV=production
      - PORT=8080
      - ANTHROPIC_API_URL=${ANTHROPIC_API_URL:-https://api.anthropic.com}
      # Admin auth
      - ADMIN_KEY=${ADMIN_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Tokens & quota
      - TOKENS=${TOKENS}
      - WINDOW_MS=${WINDOW_MS:-18000000}
      - UPSTREAM_HARD_CAP_PCT=${UPSTREAM_HARD_CAP_PCT:-95}
      - UPSTREAM_POLL_MS=${UPSTREAM_POLL_MS:-60000}
      # Storage
      - CLIPROXY_AUTH_DIR=/credentials
      - DB_FILE=/app/state/proxy.db
    networks:
      - public-net
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public-net"
      - "traefik.http.routers.claude-proxy.rule=Host(`claude-server.wibudev.com`)"
      - "traefik.http.routers.claude-proxy.entrypoints=websecure"
      - "traefik.http.routers.claude-proxy.tls=true"
      - "traefik.http.routers.claude-proxy.tls.certresolver=letsencrypt"
      - "traefik.http.services.claude-proxy.loadbalancer.server.port=8080"

networks:
  public-net:
    external: true
